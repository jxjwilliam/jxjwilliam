<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="jxjwilliam — AI Research &amp; Experiments Lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="55%" stop-color="#0a120e"/>
      <stop offset="100%" stop-color="#050706"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#39ff88" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- node-graph scatter, right side -->
  <g stroke="#2b6b4a" stroke-width="1" opacity="0.8">
    <line x1="840" y1="70" x2="930" y2="110"/>
    <line x1="930" y1="110" x2="1010" y2="60"/>
    <line x1="930" y1="110" x2="960" y2="190"/>
    <line x1="960" y1="190" x2="1060" y2="180"/>
    <line x1="1060" y1="180" x2="1120" y2="120"/>
    <line x1="960" y1="190" x2="900" y2="250"/>
    <line x1="900" y1="250" x2="1000" y2="280"/>
    <line x1="1010" y1="60" x2="1100" y2="40"/>
  </g>
  <g fill="#39ff88">
    <circle cx="840" cy="70" r="3.5"/>
    <circle cx="930" cy="110" r="5" filter="url(#softGlow)"/>
    <circle cx="1010" cy="60" r="3"/>
    <circle cx="960" cy="190" r="5.5" filter="url(#softGlow)"/>
    <circle cx="1060" cy="180" r="3"/>
    <circle cx="1120" cy="120" r="3"/>
    <circle cx="900" cy="250" r="3"/>
    <circle cx="1000" cy="280" r="3"/>
    <circle cx="1100" cy="40" r="3"/>
  </g>
  <circle cx="930" cy="110" r="70" fill="url(#nodeGlow)"/>
  <circle cx="960" cy="190" r="60" fill="url(#nodeGlow)"/>

  <!-- terminal window chrome -->
  <rect x="60" y="52" width="640" height="216" rx="10" fill="#0d1512" stroke="#1f3d2c" stroke-width="1.5"/>
  <rect x="60" y="52" width="640" height="30" rx="10" fill="#101b16"/>
  <circle cx="82" cy="67" r="5" fill="#ff5f57"/>
  <circle cx="100" cy="67" r="5" fill="#febc2e"/>
  <circle cx="118" cy="67" r="5" fill="#28c840"/>
  <text x="360" y="72" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="12" fill="#5f8f75">~/jxjwilliam/lab — zsh</text>

  <text x="86" y="118" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="15" fill="#5f8f75">$ whoami</text>
  <text x="86" y="146" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="28" font-weight="700" fill="#eafff2" filter="url(#softGlow)">jxjwilliam</text>
  <text x="86" y="174" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="15" fill="#89e6b0">AI Research &amp; Experiments Lab</text>

  <text x="86" y="206" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="13" fill="#5f8f75">$ cat focus.txt</text>
  <text x="86" y="228" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="13" fill="#c9d9d0">LLM fine-tuning · OCR pipelines · streaming data systems</text>

  <rect x="86" y="244" width="10" height="16" fill="#39ff88">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="104" y="257" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="13" fill="#5f8f75">$</text>

  <rect x="60" y="52" width="640" height="216" rx="10" fill="none" stroke="url(#amberGlow)" stroke-width="1"/>
</svg>
